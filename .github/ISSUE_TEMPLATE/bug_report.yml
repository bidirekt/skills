name: Bug report
description: Report something that does not work as expected.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What you asked the agent
      description: The request you gave the agent.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract
      description: The contract file involved, if any.
      render: yaml
